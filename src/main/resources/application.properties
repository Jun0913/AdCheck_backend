spring.application.name=backend

# Server
server.port=8080

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/adcheck?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:adcheck}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:adcheck1234}

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Python service URL
python.server.url=${PYTHON_SERVER_URL:http://localhost:8000}
python.server.connect-timeout-ms=${PYTHON_SERVER_CONNECT_TIMEOUT_MS:3000}
python.server.read-timeout-ms=${PYTHON_SERVER_READ_TIMEOUT_MS:30000}

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
jwt.secret=${JWT_SECRET:adcheck-secret-key-for-jwt-token-minimum-32-characters}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Mail (SMTP) - defaults to Gmail (587, STARTTLS); override with env vars
spring.mail.host=${SMTP_HOST:smtp.naver.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.protocols=${SMTP_SSL_PROTOCOLS:TLSv1.2}
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST:smtp.naver.com}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITETIMEOUT:5000}
spring.mail.default-encoding=UTF-8

# Increase JavaMail debug by enabling at runtime: -Dmail.debug=true
