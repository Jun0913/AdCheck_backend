spring.application.name=backend

# Server
server.port=8080

# H2 in-memory DB
spring.datasource.url=jdbc:h2:mem:adcheck;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# MySQL (uncomment and adjust when switching from H2)
#spring.datasource.url=jdbc:mysql://localhost:3306/adcheck?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.username=root
#spring.datasource.password=your_password

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Python service URL
python.server.url=${PYTHON_SERVER_URL:http://localhost:8000}

# Multipart upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT
jwt.secret=${JWT_SECRET:adcheck-secret-key-for-jwt-token-minimum-32-characters}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Mail (SMTP) - defaults to Gmail (587, STARTTLS); override with env vars
spring.mail.host=${SMTP_HOST:smtp.naver.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.protocols=${SMTP_SSL_PROTOCOLS:TLSv1.2}
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST:smtp.naver.com}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITETIMEOUT:5000}
spring.mail.default-encoding=UTF-8

# Increase JavaMail debug by enabling at runtime: -Dmail.debug=true
